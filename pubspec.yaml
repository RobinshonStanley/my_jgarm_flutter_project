name: my_jgarm_flutter_project
description: A modern Church Management App for Jesus Grace And Restoration Ministry.
publish_to: 'http://pub.dev'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0

  # Navigation
  go_router: ^16.0.0

  # Local Notifications
  flutter_local_notifications: ^19.4.0

  # UI
  google_fonts: ^6.3.0
  flutter_svg: ^2.2.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Media
  image_picker: ^1.2.0
  file_picker: ^10.3.2
  video_player: ^2.10.0
  just_audio: ^0.10.4

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  connectivity_plus: ^7.0.0

  # Forms
  form_validator: ^2.1.1

  # Loading & Toasts
  fluttertoast: ^8.2.12
  flutter_spinkit: ^5.2.2

  # PDF
  pdf: ^3.11.3
  printing: ^5.14.2

  # Icons
  font_awesome_flutter: ^10.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.7.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/
    - assets/videos/
    - assets/documents/
    
